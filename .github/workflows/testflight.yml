# TestFlight y tienda sin Mac: un runner macOS de GitHub compila y sube la
# build a App Store Connect.
#   - Push a la rama de abajo → build solo para pruebas internas de TestFlight
#     (no vale para enviar a la tienda). Los cambios que solo tocan .github,
#     docs o los metadatos de fastlane no la disparan.
#   - Push de una etiqueta v* (p. ej. v2.4.4) → build apta para la tienda:
#     después se elige en App Store Connect, en la versión nueva, y se envía
#     a revisión desde la web.
# El lanzamiento a mano (Actions → TestFlight → Run workflow) solo funciona
# cuando el fichero exista también en la rama principal, que es la que GitHub
# indexa.
#
# Necesita tres secretos del repo (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      Key ID de una clave de la API de App Store Connect
#   ASC_ISSUER_ID   Issuer ID de esa clave
#   ASC_KEY_P8      El contenido entero del fichero .p8 de la clave
# La clave tiene que ser de rol Admin: la firma la gestiona Xcode en la nube
# con ella (no hay certificados en el runner), y eso exige Admin.
# Opcionales: GEMINI_API_KEY y GROQ_API_KEY (la IA está deshabilitada).
#
# La tienda aún no acepta builds de Xcode 27: se usa el Xcode 26 más nuevo
# del runner. El número de build lo pone Xcode al subir (el siguiente libre).

name: TestFlight

on:
  push:
    branches:
      - claude/hola-2zj9qt
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'fastlane/metadata/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive y subida a TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26, el más nuevo del runner
        run: |
          app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$app" ]; then
            echo "::error::No hay Xcode 26 en el runner. Hay:"; ls /Applications | grep -i xcode; exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Secrets.swift y Metal Toolchain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: sh ci_scripts/ci_post_clone.sh

      - name: Clave de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Faltan secretos: ASC_KEY_ID, ASC_ISSUER_ID y ASC_KEY_P8 (Settings → Secrets → Actions)"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive
        run: |
          set +e
          xcodebuild archive \
            -project Clarity.xcodeproj -scheme Clarity -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Clarity.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/archive.log" 2>&1
          estado=$?
          set -e
          # Solo lo que importa en pantalla; el registro entero va al artefacto.
          grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/archive.log" || true
          exit $estado

      - name: Subir a App Store Connect
        run: |
          # Etiqueta v*: build de tienda. Rama: solo pruebas internas de TestFlight.
          plist=.github/ExportOptions.plist
          case "$GITHUB_REF" in
            refs/tags/*) plist=.github/ExportOptionsAppStore.plist; echo "Build de tienda ($GITHUB_REF_NAME)";;
          esac
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Clarity.xcarchive" \
            -exportOptionsPlist "$plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Registro del archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
